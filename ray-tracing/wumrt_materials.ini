# HASH     ROUGHNESS REFLECTIVITY METAL EMISSIVE [COAT]   # what it is
#
# The game's own materials are all dull (specular powers 5 to 30), so anything meant to look
# glossy, metallic or glowing is listed here. Labelled by eye from materials.py sheets;
# eight levels' worth so far. Textures not listed keep the game's own (matte) values.
# COAT (optional, 0..1): a clear varnish over the surface (toy plastic, enamel paint, glass,
# glazed tiles); with the clearcoat setting it adds a second, sharp sun highlight (see README
# "Clear coat"). Metals take none (their own reflection is the shine). Needs EMISSIVE written.
