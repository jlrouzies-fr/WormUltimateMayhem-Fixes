# Per-level colour script (grade.c, read with grade_levels = 1; rt.py reload reads it again).
# Each level grade sits on top of the global grade (tone_contrast, saturation, grade_warm,
# grade_auto ...) and blends in over ~2 s (grade_speed) when the level is recognised.
#
# [Level name]
# textures HASH HASH ...     terrain textures that mark the level ("grade: terrain HASH" in the log);
#                            the level whose listed textures were drawn most in the last 2 s wins
# lift  R G B                added in the shadows (linear, small: 0.002-0.01)       default 0 0 0
# gamma R G B                midtones (above 1 brighter)                             default 1 1 1
# gain  R G B                multiplies everything (colour of the light)             default 1 1 1
# saturation S               on top of the global saturation                         default 1
# One value for lift / gamma / gain sets all three channels.
# night 1                    keep the grade on a night match (default: it fades out as grade_auto
#                            sees night, so a sunny-afternoon grade does not fight the moonlight)

