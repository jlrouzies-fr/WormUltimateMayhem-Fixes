# Terrain textures that carry shell layers (see surfaces.py and the README).
#
# HASH     KIND  [HEIGHT [DENSITY]]   # what it is
#
# KIND is grass or moss. HEIGHT and DENSITY scale shell_height and shell_density from
# wumrt.ini for this texture (grass: 1 1, moss: 0.45 1.6 unless given). With `scatter = 1`
# grass and moss also get tufts along their border.
#
# HASH     rock|sand  [DENSITY]          # scattered stones (scatter = 1): rock gets pebbles and
#                                        # rubble at the foot of its cliffs, sand a few pebbles The hash is the same
# as in wumrt_materials.ini. Only terrain draws look here, so a green texture that is only
# ever used on objects does no harm.

